name: Sync tenders to website
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run sync
        env:
          SOURCE_SUPABASE_URL: ${{ secrets.SOURCE_SUPABASE_URL }}
          SOURCE_KEY: ${{ secrets.SOURCE_KEY }}
          RADAR_SUPABASE_URL: ${{ secrets.RADAR_SUPABASE_URL }}
          RADAR_SERVICE_KEY: ${{ secrets.RADAR_SERVICE_KEY }}
          SOURCE_TABLE: ${{ vars.SOURCE_TABLE }}
        run: python sync_from_scraper.py
